<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap - Tinder de Habilidades</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <img id="icontop" src="../image/inoneskills.png" alt="iconskillswap">
        <div class="text-header">
            <h1>SkillSwap</h1>
            <p>O Tinder de Habilidades com IA</p>
        </div>

    </header>
        <section>
            <img src="../image/inoneskills.png" alt="iconskillswap">
            <h1>Bem-Vindo ao SkillSwap</h1>
            <h2>Acesse sua conta ou cadastre-se para trocar de habilidades</h2>
            <nav>
                <a id="bcadastro" href="index.html">Login</a>
                <a id="blogin" href="cadastro.html">Cadastro</a>
            </nav>
   <div class="inputs">
                <input type="text" id="cad_nome" placeholder="Seu nome">
                <input type="text" id="cad_email" placeholder="Seu e-mail">
                <input type="password" id="cad_senha" placeholder="Sua Senha">
            </div>
            <button id="entrar" onclick="salvarCadastro(event)">
                <span>🚀</span>Cadastrar
            </button>
            <div class="divisor">
                <span></span>
            </div>

        </section>
        <script src="javascript/cadastro.js"></script>
</body>
</html>
